<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h2>Welcome to the office</h2>
    <p>Name of doctor you want to see:</p>
    <input type="text" placeholder="Enter doctor's name" />
    <input type="text" placeholder="address" />
    <input type="text" placeholder="phone number" />
    <input type="text" placeholder="email" />
    <input type="text" placeholder="zip code" />
    <p>Choose the date you want to see the doctor:</p>
    <input type="date" />
    <p>Choose the time you want to see the doctor:</p>
    <input type="time" />
    <p>Choose the type of appointment:</p>
    <select>
      <option value="general">General Checkup</option>
      <option value="specialist">Specialist Consultation</option>
      <option value="followup">Follow-up Appointment</option>
    </select>
    <p>Choose the mode of appointment:</p>
    <input type="radio" name="mode" value="inperson" /> In-person
    <input type="radio" name="mode" value="telemedicine" /> Telemedicine
    <p>Any additional notes or concerns:</p>
    <textarea placeholder="Enter your notes here"></textarea>
    <br />
    <button type="submit">Submit</button>
    <button type="reset">Reset</button>
  </body>
</html>
