<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>simple BMW Logo</title>
    <style>
        body {
            background-color: white;
            font-family: Arial, sans-serif;
        }
        .logo {
            width: 180px;
            height: 180px;
            border: 8px solid black;
            border-radius: 50%;
            margin: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .inner-circle {
            width: 120px;
            height: 120px;
            border: 4px solid black;
            border-radius: 50%;

            background: conic-gradient(
                blue 0deg 90deg,
                white 90deg 180deg,
                blue 180deg 270deg,
                white 270deg 360deg
            );
        }
        h2 {
            margin-left: 55px;
        }
    </style>
</head>
<body>
    <div class="logo">
        <div class="inner-circle"></div>
    </div>
</body>
</html>
